<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Demo - Starter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 id="main-title">DOM Practice Demo</h1>
    <p id="intro">
      Use the buttons below to practice changing the page with JavaScript.
    </p>

    <div class="button-row">
      <button id="change-title-btn">Change Title</button>
      <button id="update-text-btn">Update Intro Text</button>
      <button id="highlight-btn">Highlight Notes</button>
      <button id="add-note-btn">Add Note</button>
      <button id="remove-note-btn">Remove Last Note</button>
    </div>

    <section id="notes-section">
      <h2>Notes</h2>
      <p class="note">This is note 1.</p>
      <p class="note">This is note 2.</p>
      <p class="note">This is note 3.</p>
    </section>
  </body>
</html>
